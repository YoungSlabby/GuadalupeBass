
name: Build Guadalupe Bass VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: pwsh
        run: |
          Expand-Archive -Path "GuadalupeBass.zip" -DestinationPath "source" -Force

      - name: Configure
        run: cmake -S source/GuadalupeBass -B build -G "Visual Studio 17 2022" -A x64

      - name: Compile
        run: cmake --build build --config Release

      - name: Package VST3
        uses: actions/upload-artifact@v4
        with:
          name: GuadalupeBass-VST3-Windows-x64
          path: build/GuadalupeBass_artefacts/Release/VST3/
          if-no-files-found: error
